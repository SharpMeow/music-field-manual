name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Install Chromium for the route check
        run: npx playwright install --with-deps chromium

      - name: Start the dev server
        run: |
          npm run dev > dev.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:8080/ && exit 0
            sleep 2
          done
          echo "dev server did not start"; cat dev.log; exit 1

      - name: Check every route
        run: npm run check:routes

      - name: Dev server log
        if: failure()
        run: cat dev.log

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Check compose.yaml
        run: docker compose config --quiet

      - name: Build the image and start it
        run: docker compose up --build --detach --wait --wait-timeout 120

      - name: Check a few pages
        run: |
          for path in / /news /manual /mpc/setup /guitar/board; do
            curl -sf -o /dev/null "http://127.0.0.1:8080$path" || { echo "failed: $path"; exit 1; }
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/no-such-page)
          [ "$code" = "404" ] || { echo "unknown page returned $code, expected 404"; exit 1; }

      - name: Container log
        if: failure()
        run: docker compose logs

      - name: Stop
        if: always()
        run: docker compose down
