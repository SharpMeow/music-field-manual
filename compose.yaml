# One command to run the production build locally:
#
#   docker compose up --build
#
# Then open http://localhost:8080 (or the APP_PORT you set in .env).
#
# There is no database service on purpose. The book keeps progress in the
# browser (localStorage), and no route touches a database.

services:
  app:
    build: .
    image: music-field-manual:local
    env_file:
      - path: .env
        required: false
    environment:
      # The container always listens on 8080. Change the host side with APP_PORT.
      HOST: 0.0.0.0
      PORT: "8080"
    ports:
      - "${APP_PORT:-8080}:8080"
    restart: unless-stopped
